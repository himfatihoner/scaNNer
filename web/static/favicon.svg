<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#60a5fa"/>
      <stop offset="0.55" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <linearGradient id="gloss" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- rounded-square badge, matching the in-app logo mark -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bg)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#gloss)"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <!-- magnifying glass -->
  <g fill="none" stroke="#ffffff" stroke-width="5.5" stroke-linecap="round">
    <circle cx="27.5" cy="27.5" r="12.5"/>
    <line x1="37.5" y1="37.5" x2="49" y2="49"/>
  </g>
  <!-- lens highlight for depth -->
  <path d="M20.5 22.5a10 10 0 0 1 6-5.5" fill="none" stroke="#ffffff" stroke-opacity="0.65" stroke-width="2.5" stroke-linecap="round"/>
</svg>
