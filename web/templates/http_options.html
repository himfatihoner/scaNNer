{{define "http_options"}}
<!-- Custom Headers & Cookies -->
<div x-data="{showOpts: false}">
    <button type="button" onclick="this.nextElementSibling.classList.toggle('hidden');this.querySelector('svg').classList.toggle('rotate-180')"
            class="flex items-center gap-2 text-xs text-dark-400 hover:text-accent-400 transition-colors mb-2">
        <svg class="w-3 h-3 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/></svg>
        Custom Headers & Cookies
    </button>
    <div class="hidden space-y-3 bg-dark-850 border border-dark-700 rounded-lg p-3">
        <!-- Headers -->
        <div>
            <div class="flex items-center justify-between mb-1.5">
                <label class="text-[11px] text-dark-400 uppercase tracking-wider">Headers{{template "info_icon" "Custom HTTP headers to send with every request (e.g. Authorization, X-API-Key). Global User-Agent and proxy settings also apply automatically."}}</label>
                <button type="button" onclick="addHeaderRow(this)" class="text-[10px] text-accent-400 hover:text-accent-300">+ Add</button>
            </div>
            <div class="space-y-1.5" id="headerRows">
                <div class="flex gap-1.5 items-center">
                    <div class="relative flex-1">
                        <input type="text" name="header_name" placeholder="Header name" list="headerPresetNames"
                               class="w-full mono bg-dark-900 border border-dark-700 rounded px-2 py-1.5 text-[11px] text-white placeholder-dark-600 focus:outline-none focus:border-accent-500">
                    </div>
                    <div class="relative flex-[2]">
                        <input type="text" name="header_value" placeholder="Value"
                               class="w-full mono bg-dark-900 border border-dark-700 rounded px-2 py-1.5 text-[11px] text-white placeholder-dark-600 focus:outline-none focus:border-accent-500">
                    </div>
                    <button type="button" onclick="this.parentElement.remove()" class="text-dark-600 hover:text-danger shrink-0">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            <!-- Presets -->
            <div class="mt-2">
                <p class="text-[10px] text-dark-500 mb-1">Quick add:</p>
                <div class="flex flex-wrap gap-1">
                    <button type="button" onclick="addPresetHeader('Authorization','Bearer ')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">Bearer Token</button>
                    <button type="button" onclick="addPresetHeader('X-API-Key','')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">API Key</button>
                    <button type="button" onclick="addPresetHeader('X-Forwarded-For','127.0.0.1')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">X-Forwarded-For</button>
                    <button type="button" onclick="addPresetHeader('X-Real-IP','127.0.0.1')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">X-Real-IP</button>
                    <button type="button" onclick="addPresetHeader('Origin','https://')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">Origin</button>
                    <button type="button" onclick="addPresetHeader('Referer','https://')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">Referer</button>
                    <button type="button" onclick="addPresetHeader('X-Original-URL','/admin')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">X-Original-URL</button>
                    <button type="button" onclick="addPresetHeader('X-Requested-With','XMLHttpRequest')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">XHR</button>
                </div>
            </div>
        </div>

        <div class="border-t border-dark-700"></div>

        <!-- Cookies -->
        <div>
            <div class="flex items-center justify-between mb-1.5">
                <label class="text-[11px] text-dark-400 uppercase tracking-wider">Cookies{{template "info_icon" "Custom cookies to send with every request. Useful for authenticated scans."}}</label>
                <button type="button" onclick="addCookieRow(this)" class="text-[10px] text-accent-400 hover:text-accent-300">+ Add</button>
            </div>
            <div class="space-y-1.5" id="cookieRows">
                <div class="flex gap-1.5 items-center">
                    <div class="relative flex-1">
                        <input type="text" name="cookie_name" placeholder="Cookie name" list="cookiePresetNames"
                               class="w-full mono bg-dark-900 border border-dark-700 rounded px-2 py-1.5 text-[11px] text-white placeholder-dark-600 focus:outline-none focus:border-accent-500">
                    </div>
                    <div class="relative flex-[2]">
                        <input type="text" name="cookie_value" placeholder="Value"
                               class="w-full mono bg-dark-900 border border-dark-700 rounded px-2 py-1.5 text-[11px] text-white placeholder-dark-600 focus:outline-none focus:border-accent-500">
                    </div>
                    <button type="button" onclick="this.parentElement.remove()" class="text-dark-600 hover:text-danger shrink-0">
                        <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
            </div>
            <div class="mt-2">
                <p class="text-[10px] text-dark-500 mb-1">Quick add:</p>
                <div class="flex flex-wrap gap-1">
                    <button type="button" onclick="addPresetCookie('session','')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">session</button>
                    <button type="button" onclick="addPresetCookie('PHPSESSID','')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">PHPSESSID</button>
                    <button type="button" onclick="addPresetCookie('JSESSIONID','')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">JSESSIONID</button>
                    <button type="button" onclick="addPresetCookie('token','')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">token</button>
                    <button type="button" onclick="addPresetCookie('csrf_token','')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">csrf_token</button>
                    <button type="button" onclick="addPresetCookie('connect.sid','')" class="text-[9px] px-1.5 py-0.5 rounded bg-dark-800 text-dark-400 hover:text-accent-400 hover:bg-dark-700">connect.sid</button>
                </div>
            </div>
        </div>
    </div>
</div>

<datalist id="headerPresetNames">
    <option value="Authorization">
    <option value="X-API-Key">
    <option value="X-Auth-Token">
    <option value="Accept">
    <option value="Accept-Language">
    <option value="Referer">
    <option value="Origin">
    <option value="User-Agent">
    <option value="X-Forwarded-For">
    <option value="X-Real-IP">
    <option value="X-Forwarded-Host">
    <option value="X-Original-URL">
    <option value="X-Rewrite-URL">
    <option value="X-Requested-With">
    <option value="X-Custom-IP-Authorization">
    <option value="X-Debug">
    <option value="Content-Type">
    <option value="Cookie">
</datalist>
<datalist id="cookiePresetNames">
    <option value="session">
    <option value="PHPSESSID">
    <option value="JSESSIONID">
    <option value="ASP.NET_SessionId">
    <option value="connect.sid">
    <option value="token">
    <option value="csrf_token">
    <option value="_csrf">
    <option value="laravel_session">
    <option value="wordpress_logged_in">
    <option value="auth">
    <option value="jwt">
</datalist>

<script>
function addHeaderRow() {
    var container = document.getElementById('headerRows');
    var row = document.createElement('div');
    row.className = 'flex gap-1.5 items-center';
    row.innerHTML = '<div class="relative flex-1"><input type="text" name="header_name" placeholder="Header name" list="headerPresetNames" class="w-full mono bg-dark-900 border border-dark-700 rounded px-2 py-1.5 text-[11px] text-white placeholder-dark-600 focus:outline-none focus:border-accent-500"></div><div class="relative flex-[2]"><input type="text" name="header_value" placeholder="Value" class="w-full mono bg-dark-900 border border-dark-700 rounded px-2 py-1.5 text-[11px] text-white placeholder-dark-600 focus:outline-none focus:border-accent-500"></div><button type="button" onclick="this.parentElement.remove()" class="text-dark-600 hover:text-danger shrink-0"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>';
    container.appendChild(row);
}
function addCookieRow() {
    var container = document.getElementById('cookieRows');
    var row = document.createElement('div');
    row.className = 'flex gap-1.5 items-center';
    row.innerHTML = '<div class="relative flex-1"><input type="text" name="cookie_name" placeholder="Cookie name" list="cookiePresetNames" class="w-full mono bg-dark-900 border border-dark-700 rounded px-2 py-1.5 text-[11px] text-white placeholder-dark-600 focus:outline-none focus:border-accent-500"></div><div class="relative flex-[2]"><input type="text" name="cookie_value" placeholder="Value" class="w-full mono bg-dark-900 border border-dark-700 rounded px-2 py-1.5 text-[11px] text-white placeholder-dark-600 focus:outline-none focus:border-accent-500"></div><button type="button" onclick="this.parentElement.remove()" class="text-dark-600 hover:text-danger shrink-0"><svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg></button>';
    container.appendChild(row);
}
function addPresetHeader(name, value) {
    var container = document.getElementById('headerRows');
    var inputs = container.querySelectorAll('input[name="header_name"]');
    // Find empty row or add new
    for (var i = 0; i < inputs.length; i++) {
        if (inputs[i].value === '') {
            inputs[i].value = name;
            inputs[i].parentElement.nextElementSibling.querySelector('input').value = value;
            inputs[i].parentElement.nextElementSibling.querySelector('input').focus();
            return;
        }
    }
    addHeaderRow();
    var newInputs = container.querySelectorAll('input[name="header_name"]');
    var last = newInputs[newInputs.length - 1];
    last.value = name;
    last.parentElement.nextElementSibling.querySelector('input').value = value;
    last.parentElement.nextElementSibling.querySelector('input').focus();
}
function addPresetCookie(name, value) {
    var container = document.getElementById('cookieRows');
    var inputs = container.querySelectorAll('input[name="cookie_name"]');
    for (var i = 0; i < inputs.length; i++) {
        if (inputs[i].value === '') {
            inputs[i].value = name;
            inputs[i].parentElement.nextElementSibling.querySelector('input').focus();
            return;
        }
    }
    addCookieRow();
    var newInputs = container.querySelectorAll('input[name="cookie_name"]');
    var last = newInputs[newInputs.length - 1];
    last.value = name;
    last.parentElement.nextElementSibling.querySelector('input').focus();
}
</script>
{{end}}
