{{define "auth_head"}}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{.Title}}</title>
    <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32.png">
    <link rel="alternate icon" href="/favicon.ico">
    <link rel="apple-touch-icon" href="/static/apple-touch-icon.png">
    <meta name="theme-color" content="#2563eb">
    <script src="/static/js/tailwind.js"></script>
    <style type="text/tailwindcss">
        @theme {
            --color-dark-100: #e6e6e8;
            --color-dark-200: #cfd0d4;
            --color-dark-300: #adaeb5;
            --color-dark-400: #84858f;
            --color-dark-500: #696a74;
            --color-dark-700: #4c4d54;
            --color-dark-800: #434349;
            --color-dark-850: #313136;
            --color-dark-900: #27272a;
            --color-dark-925: #1e1e21;
            --color-dark-950: #18181b;
            --color-accent-400: #60a5fa;
            --color-accent-500: #3b82f6;
            --color-accent-600: #2563eb;
            --color-success: #22c55e;
            --color-warning: #eab308;
            --color-danger:  #ef4444;
        }
    </style>
</head>
{{end}}

{{define "login_page"}}
{{template "auth_head" .}}
<body class="h-full bg-dark-950 text-dark-100 antialiased">
    <div class="relative min-h-full flex items-center justify-center px-4 py-12 overflow-hidden">
        <!-- ambient background glows -->
        <div aria-hidden="true" class="pointer-events-none absolute inset-0">
            <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[46rem] h-[46rem] rounded-full bg-accent-600/10 blur-3xl"></div>
            <div class="absolute bottom-[-8rem] right-[-6rem] w-[28rem] h-[28rem] rounded-full bg-accent-500/5 blur-3xl"></div>
        </div>

        <div class="relative w-full max-w-sm">
            <!-- brand -->
            <div class="flex flex-col items-center text-center mb-8">
                <img src="/static/favicon.svg" alt="scaNNer" width="56" height="56" class="w-14 h-14 mb-4 drop-shadow-lg">
                <div class="text-3xl font-bold tracking-tight text-white">sca<span class="text-accent-400">NN</span>er</div>
                <p class="text-[11px] text-dark-400 uppercase tracking-[0.25em] mt-1.5">Scan Toolkit</p>
            </div>

            <!-- card -->
            <div class="rounded-2xl bg-dark-900/80 backdrop-blur border border-dark-800 shadow-2xl shadow-black/40 p-7">
                <div class="mb-5">
                    <h1 class="text-lg font-semibold text-white">Sign in</h1>
                    <p class="text-sm text-dark-400 mt-0.5">Enter your credentials to continue.</p>
                </div>

                {{if .Error}}
                <div class="mb-4 flex items-start gap-2 rounded-lg border border-danger/40 bg-danger/10 px-3 py-2.5 text-sm text-danger">
                    <svg class="w-4 h-4 mt-0.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z"/>
                    </svg>
                    <span>{{.Error}}</span>
                </div>
                {{end}}

                <form method="POST" action="/login" class="space-y-4">
                    <input type="hidden" name="next" value="{{.Next}}">
                    <div>
                        <label class="block text-xs font-medium text-dark-300 mb-1.5" for="username">Username</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-dark-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.5 20.1a7.5 7.5 0 0115 0A17.9 17.9 0 0112 21.75c-2.68 0-5.22-.59-7.5-1.63z"/>
                                </svg>
                            </span>
                            <input id="username" name="username" type="text" autocomplete="username" autofocus required placeholder="admin"
                                class="w-full rounded-lg bg-dark-950 border border-dark-700 pl-10 pr-3 py-2.5 text-sm text-dark-100 placeholder-dark-500 focus:border-accent-500 focus:ring-2 focus:ring-accent-500/30 focus:outline-none transition">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-dark-300 mb-1.5" for="password">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-dark-500">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z"/>
                                </svg>
                            </span>
                            <input id="password" name="password" type="password" autocomplete="current-password" required placeholder="••••••••"
                                class="w-full rounded-lg bg-dark-950 border border-dark-700 pl-10 pr-3 py-2.5 text-sm text-dark-100 placeholder-dark-500 focus:border-accent-500 focus:ring-2 focus:ring-accent-500/30 focus:outline-none transition">
                        </div>
                    </div>
                    <button type="submit"
                        class="w-full inline-flex items-center justify-center gap-2 rounded-lg bg-accent-600 hover:bg-accent-500 text-white text-sm font-medium py-2.5 shadow-lg shadow-accent-600/20 focus:outline-none focus:ring-2 focus:ring-accent-500/50 transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.75 9V5.25A2.25 2.25 0 0013.5 3h-6a2.25 2.25 0 00-2.25 2.25v13.5A2.25 2.25 0 007.5 21h6a2.25 2.25 0 002.25-2.25V15m3 0l3-3m0 0l-3-3m3 3H9"/>
                        </svg>
                        Sign in
                    </button>
                </form>
            </div>

            <p class="text-center text-xs text-dark-500 mt-6 flex items-center justify-center gap-1.5">
                <svg class="w-3.5 h-3.5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12.75 11.25 15 15 9.75m-3-7.04a11.96 11.96 0 01-8.4 3.29 12 12 0 00-.6 3.75c0 5.59 3.82 10.29 9 11.62 5.18-1.33 9-6.03 9-11.62 0-1.31-.21-2.57-.6-3.75a11.96 11.96 0 01-8.4-3.29z"/>
                </svg>
                Authorized use only · all access is logged
            </p>
        </div>
    </div>
</body>
</html>
{{end}}
